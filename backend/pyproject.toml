[project]
name = "videomind"
version = "0.0.0"
description = "VideoMind local multimodal platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.14.1", "pydantic-settings==2.16.0",
  "fastapi==0.144.0", "uvicorn==0.54.0", "sqlalchemy==2.1.5",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "redis==8.1.0",
  "celery==5.6.3", "minio==7.2.20", "pillow==12.3.0", "av==16.1.0", "pypdf==6.12.0",
]

[project.optional-dependencies]
transcription = ["faster-whisper==1.2.1"]
feasibility = [
  "torch==2.14.1", "torchvision==0.29.1", "transformers==5.20.0",
  "sentence-transformers==6.1.0", "numpy==2.5.4",
  "pillow==12.3.0", "av==16.1.0", "soundfile==0.14.0",
  "huggingface-hub>=1.3,<2", "psutil>=7,<8",
]

[dependency-groups]
dev = ["black==26.10.1", "pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videomind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
