worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 64m;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    set $api_origin http://api:8000;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /health { return 200 'ready'; }
    location /api/ { proxy_request_buffering off; proxy_read_timeout 135s; proxy_pass $api_origin; proxy_set_header Host $host; }
    location /health/ { proxy_pass $api_origin; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
